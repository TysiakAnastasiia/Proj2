name: CI Quality Gate

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci-backend:
    name: Backend Tests & Sonar Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java for Sonar
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio anyio

      - name: Run tests and generate coverage reports
        run: |
          mkdir -p reports/htmlcov
          pytest \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --cov-report=term \
            --cov-fail-under=85 \
            --junitxml=reports/junit.xml \
            tests/unit tests/integration

      - name: Upload HTML Coverage Report (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html-report
          path: backend/reports/htmlcov/
          retention-days: 30

      - name: Upload JUnit XML Report (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-xml-report
          path: backend/reports/junit.xml
          retention-days: 30

      - name: Upload Coverage XML Report (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml-report
          path: backend/reports/coverage.xml
          retention-days: 30

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=for2proj
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=reports/coverage.xml
            -Dsonar.python.xunit.reportPath=reports/junit.xml
            -Dsonar.exclusions=**/migrations/**,**/__pycache__/**,**/node_modules/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.verbose=true

  ci-quality-check:
    name: Quality Gate Status
    runs-on: ubuntu-latest
    needs: ci-backend
    if: always()
    steps:
      - name: Check CI result
        run: |
          if [ "${{ needs.ci-backend.result }}" != "success" ]; then
            echo "CI pipeline failed — blocking merge"
            exit 1
          fi
          echo "All quality gates passed!"
