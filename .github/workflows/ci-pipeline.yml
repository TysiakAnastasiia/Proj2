name: CI Quality Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci-backend:
    name: Backend Tests & Sonar Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Важливо для SonarCloud

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java for Sonar
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov # Про всяк випадок, якщо немає в requirements

      - name: Run tests and coverage
        run: |
          # Створюємо папку для звітів явно
          mkdir -p reports
          pytest --cov=app --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml tests/unit tests/integration

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=for2proj
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.sources=backend/app
            -Dsonar.tests=backend/tests
            -Dsonar.python.coverage.reportPaths=backend/reports/coverage.xml
            -Dsonar.python.xunit.reportPath=backend/reports/junit.xml

            -Dsonar.exclusions=backend/**/migrations/**,backend/**/__pycache__/**
            -Dsonar.verbose=true
