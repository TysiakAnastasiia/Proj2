name: CI Quality Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-tests:
    name: Backend tests & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests and coverage
        run: |
          pytest --maxfail=1 --disable-warnings --cov=app --cov-report=xml:reports/coverage.xml --cov-report=html:reports/htmlcov --junit-xml=reports/junit.xml tests/unit tests/integration

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            reports/coverage.xml
            reports/htmlcov
            reports/junit.xml
          if-no-files-found: error

  ci-backend-analysis:
    name: SonarQube / SonarCloud analysis
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: backend-test-reports
          path: reports

      - name: Setup Java for Sonar
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify coverage files exist
        run: |
          echo "Checking if coverage files exist:"
          ls -la reports/ || echo "reports directory not found"
          ls -la reports/coverage.xml || echo "coverage.xml not found"
          ls -la reports/junit.xml || echo "junit.xml not found"
          echo "Coverage file content preview:"
          head -10 reports/coverage.xml || echo "Cannot read coverage.xml"
          echo "Current working directory:"
          pwd
          echo "Files in current directory:"
          ls -la

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            reports/coverage.xml
            reports/htmlcov
            reports/junit.xml
          if-no-files-found: error

      - name: Run SonarQube / SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=for2proj
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=reports/coverage.xml
            -Dsonar.junit.reportPaths=reports/junit.xml
            -Dsonar.python.xunit.reportPath=reports/junit.xml
            -Dsonar.exclusions=**/migrations/**,**/__pycache__/**,**/tests/**
            -Dsonar.coverage.exclusions=**/tests/**,**/migrations/**
            -Dsonar.buildString=build-${{ github.run_number }}
            -Dsonar.automatic.analysis.disabled=true
            -Dsonar.verbose=true
