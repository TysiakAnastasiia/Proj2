name: CI Quality Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci-backend:
    name: Backend Tests & Sonar Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java for Sonar
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests and coverage
        run: |
          mkdir -p reports
          pytest \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term \
            --junitxml=reports/junit.xml \
            tests/unit tests/integration

      - name: Debug - check reports exist
          echo "=== coverage.xml ==="
          cat reports/coverage.xml | head -20
          echo "=== junit.xml ==="
          cat reports/junit.xml | head -10

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=for2proj
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=reports/coverage.xml
            -Dsonar.python.xunit.reportPath=reports/junit.xml
            -Dsonar.exclusions=**/migrations/**,**/__pycache__/**
            -Dsonar.verbose=true
